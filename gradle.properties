# Hangar publishing (release.yml). The project id is the slug in your Hangar project's URL.
hangarProject=FALVTP
# Hangar channel every push to main is published to; it must exist on the project's Channels page.
hangarChannel=Release
# Paper versions shown on Hangar. Ranges (26.1-26.3) and wildcards (26.x) work too.
paperVersion=26.3
